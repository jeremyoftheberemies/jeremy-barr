{{ define "main" }}
{{ $posts := where (where .Site.RegularPages "Section" "posts") "Params.research" "ne" true }}
{{ $byYear := $posts.GroupByDate "2006" }}
{{ range $byYear }}
<h2 class="section-heading">{{ .Key }}</h2>
<ul class="post-list">
    {{ range .Pages }}
    <li class="post-item"><span class="post-date">{{ .Date.Format "01-02" }}</span> <a class="post-link" href="{{ .RelPermalink }}">{{ .Title }}</a></li>
    {{ end }}
</ul>
{{ end }}
{{ end }}
